services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: camillo
      POSTGRES_PASSWORD: camillo
      POSTGRES_DB: camillo
    ports:
      - "5432:5432"
    volumes:
      - camillo_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camillo -d camillo"]
      interval: 5s
      timeout: 5s
      retries: 20

  db_migrator:
    build: .
    env_file:
      - .env.example
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  teatro:
    build: .
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    depends_on:
      db_migrator:
        condition: service_completed_successfully
    command: ["uvicorn", "camillo.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  camillo_pg_data:
