x-camillo-env: &camillo-env
  APP_NAME:
  APP_ENV:
  LOG_LEVEL:
  POSTGRES_USER:
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  POSTGRES_DB:
  POSTGRES_HOST:
  POSTGRES_PORT:
  EMBEDDING_DIM:
  LITELLM_COMPLETION_MODEL:
  LITELLM_EMBEDDING_MODEL:
  DECAY_RATE:
  RECALL_TOP_K:
  RECALL_VECTOR_LIMIT:
  RECALL_FULL_TEXT_SEARCH_LIMIT:
  HEBBIAN_EDGE_THRESHOLD:

services:
  postgres:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: postgres
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: camillo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: camillo
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - camillo_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camillo -d camillo"]
      interval: 5s
      timeout: 5s
      retries: 20

  sipario:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-medium
    build: .
    restart: "no"
    environment: *camillo-env
    secrets:
      - postgres_password
    command: ["alembic", "upgrade", "head"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      postgres:
        condition: service_healthy

  teatro:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-large
    build: .
    environment: *camillo-env
    secrets:
      - postgres_password
    ports:
      - "8000:8000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      sipario:
        condition: service_completed_successfully
    command: ["uvicorn", "camillo.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  camillo_pg_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
