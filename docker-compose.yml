x-camillo-env: &camillo-env
  APP_NAME:
  APP_ENV:
  LOG_LEVEL:
  POSTGRES_USER:
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  POSTGRES_DB:
  POSTGRES_HOST: postgres
  POSTGRES_PORT:
  EMBEDDING_DIM:
  LITELLM_COMPLETION_MODEL:
  LITELLM_EMBEDDING_MODEL:
  LITELLM_RERANK_MODEL:
  OPENROUTER_API_KEY:
  PHOENIX_TRACING_ENABLED:
  PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-https://phoenix-otlp.${DOCKER_DOMAIN}/v1/traces}
  PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-camillo}
  OTEL_EXPORTER_OTLP_TRACES_CERTIFICATE: /etc/ssl/certs/ca-certificates.crt
  OTEL_EXPORTER_OTLP_TRACES_CLIENT_CERTIFICATE: /run/secrets/camillo_fullchain
  OTEL_EXPORTER_OTLP_TRACES_CLIENT_KEY: /run/secrets/camillo_key
  DECAY_RATE:
  RECALL_TOP_K:
  RECALL_VECTOR_LIMIT:
  RECALL_FULL_TEXT_SEARCH_LIMIT:
  DREAMING_ENABLED:
  DREAMING_INTERVAL_SECONDS:
  DREAMING_DRY_RUN:
  DREAMING_SEED_LIMIT:
  DREAMING_MIN_SYNTHESIS_CONFIDENCE:
  DREAMING_MODEL:
  MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-camillo.${DOCKER_DOMAIN}}

services:
  postgres:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: postgres
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: camillo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: camillo
    secrets:
      - postgres_password
    volumes:
      - postgres:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camillo -d camillo"]
      interval: 5s
      timeout: 5s
      retries: 20

  sipario:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-medium
    build: .
    restart: "no"
    environment: *camillo-env
    secrets:
      - postgres_password
    command: ["alembic", "upgrade", "head"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  teatro:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-large
    build: .
    environment: *camillo-env
    secrets:
      - postgres_password
      - camillo_fullchain
      - camillo_key
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    labels:
      - "checkmk_monitor=true"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.camillo.rule=Host(`camillo.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.camillo.entrypoints=https"
      - "traefik.http.routers.camillo.middlewares=secured@file"
      - "traefik.http.routers.camillo.tls=true"
      - "traefik.http.routers.camillo.service=camillo"
      - "traefik.http.services.camillo.loadbalancer.server.port=8000"
    networks:
      - traefik_proxy
      - internal
    depends_on:
      sipario:
        condition: service_completed_successfully
    command: ["uvicorn", "camillo.main:app", "--host", "0.0.0.0", "--port", "8000"]

  dreaming_worker:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-medium
    profiles: ["scheduled"]
    build: .
    environment: *camillo-env
    secrets:
      - postgres_password
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 256m
    networks:
      - internal
    depends_on:
      sipario:
        condition: service_completed_successfully
    command: ["python", "-m", "camillo.worker", "--once"]

volumes:
  postgres:

networks:
  internal:
    internal: true
  traefik_proxy:
    external: true

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  camillo_fullchain:
    file: ./secrets/fullchain.pem
  camillo_key:
    file: ./secrets/key.pem
