[build-system]
requires = ["setuptools>=80", "setuptools-git-versioning>=2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "camillo"
dynamic = ["version"]
description = "A Postgres-native cognitive memory stack with LiteLLM, Hebbian edges, and ACT-R inspired decay."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pgvector>=0.3.0",
    "litellm>=1.50.0",
    "mcp>=1.0.0",
    "jinja2>=3.1.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
trace = [
    "arize-phoenix-otel>=0.15.0",
    "openinference-instrumentation-litellm>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "scalene>=1.5.50",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
camillo = ["ai/templates/*.jinja"]

[tool.setuptools-git-versioning]
enabled = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL/pgvector database",
    "performance: synthetic performance checks, opt-in by environment",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]
ignore = ["B008"]
